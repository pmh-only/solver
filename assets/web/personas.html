<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solver · Persona editor</title>
  <link rel="stylesheet" href="/personas.css">
  <script src="/personas.js" defer></script>
</head>
<body>
  <main>
    <header><a href="/">Solver</a><h1>Persona editor</h1>
      <p>로그인 없이 누구나 만들고 수정·삭제할 수 있는 공용 페르소나입니다. 비밀이나 개인정보를 입력하지 마세요.</p>
      <p>Discord에서 <code>@role &lt;|persona_name|&gt; 안녕</code>으로 사용하세요. 선택은 해당 메시지에만 적용됩니다.</p>
    </header>
    <section aria-labelledby="list-heading">
      <div class="heading"><h2 id="list-heading">공용 목록</h2><button type="button" id="refresh">새로고침</button></div>
      <div id="personas"></div>
    </section>
    <section aria-labelledby="editor-heading">
      <h2 id="editor-heading">만들기 / 수정</h2>
      <form id="editor">
        <label for="name">이름</label>
        <input id="name" name="name" maxlength="40" required autocomplete="off" aria-describedby="name-help">
        <p id="name-help">1–40자, 한글·영문 등 문자, 숫자, _ 또는 -만 사용합니다. 대소문자를 구분하며 같은 이름으로 저장하면 덮어씁니다.</p>
        <label for="prompt">성격과 말투</label>
        <p>호감도·혐오도 관련 내용은 페르소나에 넣을 수 없습니다. 수치는 대화에 따라 시스템이 관리합니다.</p>
        <textarea id="prompt" name="prompt" rows="10" maxlength="4000" required placeholder="예: 너는 친절한 우주 탐험가야. 별과 행성에 빗대어 짧게 대화해."></textarea>
        <div class="actions"><button type="submit">저장</button><button type="button" id="new">새로 만들기</button><button type="button" id="delete">삭제</button></div>
      </form>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
